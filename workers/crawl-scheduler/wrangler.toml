# The crawl scheduler: a cron that drains the finder's crawl queue. Deploy it from this folder:
#   npx wrangler deploy
#   npx wrangler secret put CRAWL_SECRET   (the same value the Pages project has)
name = "collab-finder-crawl-scheduler"
main = "index.js"
compatibility_date = "2024-09-23"

[vars]
FINDER_ORIGIN = "https://collabfinder.offerlab.com"

[triggers]
crons = ["* * * * *"]
