<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F5F0">
  <link rel="preconnect" href="https://cdn.shopify.com" crossorigin>
  <title>✦ Collab finder: Discover co-selling today | OfferLab</title>

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OfferLab">

  <meta property="og:description" content="Discover amazing brands you can start selling with today. Drop any brand URL and get instant collaboration recommendations.">
  <meta property="og:image" content="https://collabfinder.offerlab.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:url" content="https://collabfinder.offerlab.com">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@offerlab">
  <meta name="twitter:title" content="Collab finder | OfferLab">
  <meta name="twitter:description" content="Discover amazing brands you can start selling with today. Drop any brand URL and get instant collaboration recommendations.">
  <meta name="twitter:image" content="https://collabfinder.offerlab.com/assets/og-image.png">
  <meta name="twitter:image:alt" content="Collab finder by OfferLab - Discover amazing brands to collaborate with">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="preload" href="/fonts/AktivGrotesk_W_Rg.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/AktivGrotesk_W_Md.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/AktivGrotesk_W_Bd.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ImperialScript-Regular.ttf" as="font" type="font/ttf" crossorigin>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="off">
  %sveltekit.body%
</body>
</html>
